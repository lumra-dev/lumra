<svg
	aria-labelledby="title desc"
	fill="none"
	height="640"
	role="img"
	viewBox="0 0 1200 640"
	width="1200"
	xmlns="http://www.w3.org/2000/svg"
>
	<title id="title">Lumra abstract grid</title>
	<desc id="desc">
		A minimal abstract grid used as a documentation example image.
	</desc>
	<rect fill="url(#bg)" height="640" width="1200" />
	<g opacity="0.72">
		<path d="M120 160H1080" stroke="url(#line)" stroke-width="1" />
		<path d="M120 280H1080" stroke="url(#line)" stroke-width="1" />
		<path d="M120 400H1080" stroke="url(#line)" stroke-width="1" />
		<path d="M120 520H1080" stroke="url(#line)" stroke-width="1" />
		<path d="M240 80V560" stroke="url(#line)" stroke-width="1" />
		<path d="M480 80V560" stroke="url(#line)" stroke-width="1" />
		<path d="M720 80V560" stroke="url(#line)" stroke-width="1" />
		<path d="M960 80V560" stroke="url(#line)" stroke-width="1" />
	</g>
	<rect
		fill="white"
		fill-opacity="0.12"
		height="120"
		stroke="white"
		stroke-opacity="0.3"
		width="240"
		x="240"
		y="160"
	/>
	<rect
		fill="white"
		fill-opacity="0.18"
		height="120"
		stroke="white"
		stroke-opacity="0.42"
		width="240"
		x="480"
		y="280"
	/>
	<rect
		fill="white"
		fill-opacity="0.12"
		height="120"
		stroke="white"
		stroke-opacity="0.3"
		width="240"
		x="720"
		y="400"
	/>
	<circle cx="480" cy="280" fill="white" r="8" />
	<circle cx="720" cy="400" fill="white" r="8" />
	<defs>
		<linearGradient
			gradientUnits="userSpaceOnUse"
			id="bg"
			x1="120"
			x2="1080"
			y1="80"
			y2="560"
		>
			<stop stop-color="#18181B" />
			<stop offset="0.52" stop-color="#3F3F46" />
			<stop offset="1" stop-color="#09090B" />
		</linearGradient>
		<linearGradient
			gradientUnits="userSpaceOnUse"
			id="line"
			x1="120"
			x2="1080"
			y1="320"
			y2="320"
		>
			<stop stop-color="white" stop-opacity="0" />
			<stop offset="0.5" stop-color="white" stop-opacity="0.38" />
			<stop offset="1" stop-color="white" stop-opacity="0" />
		</linearGradient>
	</defs>
</svg>
